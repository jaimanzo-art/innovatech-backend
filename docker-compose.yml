services:
  mysql-db:
    image: mysql:8.0
    container_name: innovatech-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: innovatech
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - innovatech-network

  backend:
    build: .
    container_name: innovatech-backend
    restart: always
    depends_on:
      - mysql-db
    environment:
      PORT: 3000
      DB_HOST: mysql-db
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: innovatech
      DB_PORT: 3306
    ports:
      - "3000:3000"
    networks:
      - innovatech-network

  frontend:
    build: ../innovatech-frontend
    container_name: innovatech-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "8080:80"
    networks:
      - innovatech-network

volumes:
  mysql_data:

networks:
  innovatech-network:
    driver: bridge