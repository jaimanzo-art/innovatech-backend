name: Backend CI/CD - EKS

on:
  push:
    branches: [deploy]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER: innovatech-eks
  K8S_NAMESPACE: innovatech
  DOCKER_IMAGE: jaimeing/innovatech-backend

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas
        run: npm test --if-present

      - name: Preparar Docker
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesion en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Instalar kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.35.0"

      - name: Conectar con EKS
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER"

      - name: Desplegar nueva version en EKS
        run: |
          kubectl set image deployment/backend \
            backend="${DOCKER_IMAGE}:${GITHUB_SHA}" \
            -n "$K8S_NAMESPACE"

          kubectl rollout status deployment/backend \
            -n "$K8S_NAMESPACE" \
            --timeout=180s

          kubectl get pods -n "$K8S_NAMESPACE"
