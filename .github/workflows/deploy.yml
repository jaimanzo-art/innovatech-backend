name: CI/CD Backend Innovatech

on:
  push:
    branches:
      - deploy

jobs:
  build-and-push:
    name: Build and Push Backend Image
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir imagen Backend
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/innovatech-backend:latest .

      - name: Publicar imagen Backend
        run: docker push ${{ secrets.DOCKER_USERNAME }}/innovatech-backend:latest